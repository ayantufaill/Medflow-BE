
# PostgreSQL local development stack (simpler than MSSQL)
# Usage: docker-compose -f docker-compose.pg.yml up
#
# This replaces the complex SQL Server setup for local development
# and matches the free-tier cloud stack (Neon PostgreSQL).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: medflow_dev_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: deps            # Use deps stage (all devDeps installed) for local dev
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: development
      PORT: 5001
      DATABASE_URL: "postgresql://postgres:medflow_dev_2024@db:5432/medflow"
      JWT_SECRET: "local-dev-jwt-secret-not-for-production"
      JWT_REFRESH_SECRET: "local-dev-refresh-secret-not-for-production"
      EMAIL_PROVIDER: console
      FROM_EMAIL: noreply@medflow.com
      FROM_NAME: MedFlow
    volumes:
      - .:/app
      - /app/node_modules
    command:
      - /bin/sh
      - -c
      - |
        npx prisma db push --schema prisma/schema.prisma
        npm run dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
