name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Type-Check
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/medflow_test' }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/medflow_test' }}

      - name: Type-check & Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Database Schema
        run: |
          npx prisma db push --accept-data-loss
          npm run seed:all
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/medflow_test'
          DIRECT_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/medflow_test'
          JWT_SECRET: test-jwt-secret-for-ci-only
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only

      # tests/rls/rls.test.ts asserts its connection is NOT a superuser, because a
      # superuser bypasses RLS and every assertion in that suite would pass
      # vacuously. Without this step the CI database has no medflow_app role and
      # zero policies, and the suite fails outright rather than silently lying.
      # Must run after `prisma db push` — it grants on the tables that creates.
      - name: Apply RLS policies and create the medflow_app role
        run: npm run rls:apply
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/medflow_test'
          DIRECT_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/medflow_test'
          APP_DB_PASSWORD: ci-only-app-db-password

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/medflow_test'
          DIRECT_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/medflow_test'
          # The RLS suite connects as the restricted role created above. It cannot
          # be derived from DATABASE_URL here (that names `postgres`, not the
          # `medflow` owner the derivation rewrites), so it is spelled out.
          RLS_TEST_DATABASE_URL: 'postgresql://medflow_app:ci-only-app-db-password@localhost:5432/medflow_test'
          APP_DB_PASSWORD: ci-only-app-db-password
          JWT_SECRET: test-jwt-secret-for-ci-only
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only

