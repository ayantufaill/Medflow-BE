name: CI — Backend

on:
  push:
    branches: [main, rbac-surface, rbac-core, integration]
  pull_request:
    branches: [main, integration]

jobs:
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Route-scope guard
        run: npm run check:routes
