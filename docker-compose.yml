services:
  api:
    build: .
    ports:
      - "5001:5001"
    env_file:
      - ./.env.docker
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file:
      - ./.env.docker
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env.docker
    volumes:
      - ./opendental_schema_create.sql:/init/opendental_schema_create.sql:ro
      - ./docker/db-init.sh:/init/db-init.sh:ro
    command: ["/bin/sh", "/init/db-init.sh"]

volumes:
  mssql_data:
