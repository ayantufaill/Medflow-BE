services:
  api-dev:
    build:
      context: .
      target: dev
    profiles: ["dev"]
    ports:
      - "5002:5001"
    env_file:
      - ./.env.docker
    environment:
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["/bin/sh", "-c", "npx prisma generate --schema prisma/schema.prisma && npm run dev"]
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  api:
    build: .
    ports:
      - "5001:5001"
    env_file:
      - ./.env.docker
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  db:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file:
      - ./.env.docker
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-init:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env.docker
    volumes:
      - ./opendental_schema_create.sql:/init/opendental_schema_create.sql:ro
      - ./docker/db-init.sh:/init/db-init.sh:ro
    command: ["/bin/sh", "/init/db-init.sh"]

volumes:
  mssql_data:
