services:
  - type: web
    name: medflow-api
    runtime: node
    rootDir: Medflow-BE
    region: oregon            # Choose: oregon | ohio | frankfurt | singapore
    plan: free                # Free tier: 512MB RAM, 0.1 CPU, spins down after 15min inactivity

    buildCommand: |
      npm ci
      npx prisma generate --schema prisma/schema.prisma
      npm run build

    # Startup order matters:
    #   1. db push  — creates/updates tables AS THE OWNER (DIRECT_DATABASE_URL),
    #                 before RLS, since the policies ALTER those tables.
    #   2. applyRls — enables RLS + creates/rotates the medflow_app role.
    #                 Without this, the app runs with zero policies and every
    #                 SET LOCAL in src/config/db.ts is a no-op.
    #   3. server   — connects as medflow_app (DATABASE_URL); its startup guard
    #                 refuses to boot if RLS is not effective.
    #
    # --accept-data-loss is deliberately absent: it lets Prisma silently DROP
    # columns/tables in a database holding patient records.
    startCommand: >-
      npx prisma db push --schema prisma/schema.prisma --skip-generate
      && node dist/scripts/applyRls.js
      && node dist/server.js

    healthCheckPath: /health

    # Auto-deploy on every push to the connected branch
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001

      # ── Set these in Render dashboard (sensitive values) ────────────────────
      # DATABASE_URL must use the medflow_app role, NOT postgres. The app's
      # startup guard exits non-zero in production if the connected user is a
      # superuser, has BYPASSRLS, or if zero RLS policies exist.
      - key: DATABASE_URL
        sync: false           # postgresql://medflow_app:<pw>@host/db
      - key: DIRECT_DATABASE_URL
        sync: false           # Owner connection — db push + applyRls only
      - key: APP_DB_PASSWORD
        sync: false           # Password for medflow_app; rotate to invalidate

      - key: JWT_SECRET
        generateValue: true   # Render generates a secure random value automatically

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_ACCESS_EXPIRES_IN
        value: 1d

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      - key: CORS_ORIGIN
        sync: false           # Set to your frontend URL

      - key: EMAIL_PROVIDER
        value: console        # Change to 'gmail' in production

      - key: FROM_EMAIL
        value: noreply@medflow.com

      - key: FROM_NAME
        value: MedFlow

      # Optional — set in dashboard if using S3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-west-2
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_S3_BASE_URL
        sync: false

    # Render free tier gets 512MB RAM. Node's default heap is ~1.5GB which
    # causes OOM. Cap it at 400MB to leave room for the OS.
    envVarsFromFile: []       # (placeholder — remove if not using envVarsFromFile)
